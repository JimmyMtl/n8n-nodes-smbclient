name: CVE Security Scan

on:
  # Scan every PR targeting main.
  pull_request:
    branches:
      - main

  # Re-scan once the code actually lands on main.
  push:
    branches:
      - main

  # Weekly sweep: catches vulnerabilities disclosed after the code was merged,
  # without needing any new commit. Mondays at 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'

  # Allow the release workflows to use this workflow as a hard gate.
  workflow_call:

  # Useful if you want to manually re-check the repository.
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  osv-scan:
    name: OSV Dependency Scan

    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1

    permissions:
      actions: read
      contents: read
      security-events: write

    with:
      # Recursively inspect the repository.
      # OSV automatically detects pnpm-lock.yaml.
      scan-args: |-
        --recursive
        ./

      # Fail the GitHub Action if a known vulnerability is found.
      fail-on-vuln: true

      # Upload results to:
      # GitHub -> Security -> Code scanning
      upload-sarif: true
