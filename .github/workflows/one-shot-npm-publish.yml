# Manually-triggered release: bump the version, commit/tag it, then publish to npm.
#
# Trigger it from the Actions tab ("Run workflow") and supply `version`:
#   - an explicit semver, e.g. "1.2.0"
#   - or a bump keyword: "patch" | "minor" | "major"
#
# The workflow writes that version into package.json, commits it back to the
# branch and creates a matching `vX.Y.Z` tag, then publishes — so you never have
# to edit package.json by hand for a release.
#
# Requires the NPM_TOKEN secret (an npm automation token with publish rights).

name: Version Bump and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (explicit semver like 1.2.0, or patch/minor/major)'
        required: true
        type: string

# `contents: write` so the workflow can push the version-bump commit and tag back;
# the rest is for the CVE gate's SARIF upload.
permissions:
  actions: read
  contents: write
  security-events: write

jobs:
  # Hard gate: no bump, no tag, no publish if a known vulnerability is found.
  cve-scan:
    uses: ./.github/workflows/security-cve.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  publish-npm:
    needs: cve-scan
    runs-on: ubuntu-latest
    # `id-token: write` lets npm mint the provenance statement n8n requires
    # for verified community nodes.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Push the bump commit and tag over SSH using a write-enabled deploy
          # key. The default GITHUB_TOKEN cannot do this: the "CVE gate" ruleset
          # requires the "OSV Dependency Scan / osv-scan" check on main, and a
          # freshly created bump commit has no such check, so the push is
          # rejected with GH013. Deploy keys are the ruleset's bypass actor
          # (GitHub only allows the GitHub Actions app as a bypass actor on
          # organisation-owned repos, not personal ones).
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: pnpm install --frozen-lockfile

      # Write the requested version into package.json (no tag/commit yet — we do
      # that ourselves below so the message and tag are under our control).
      #
      # If the requested version is already the one in package.json, skip the
      # bump: this lets a release whose publish step failed be re-run with the
      # same version instead of burning a new one.
      - name: Set version
        id: bump
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "${REQUESTED_VERSION#v}" = "${CURRENT_VERSION}" ]; then
            echo "package.json is already at ${CURRENT_VERSION}; skipping the bump"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            # `pnpm version` prints a human message ("Releasing pkg: x → y"), not
            # the bare version, so read the result back from package.json instead.
            pnpm version "${REQUESTED_VERSION}" --no-git-tag-version
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${NEW_VERSION}"

      # Commit the bump and tag it, then push both back to the triggering branch.
      # NOTE: this pushes directly to the branch the workflow ran on. If that
      # branch is protected (required reviews/checks), the default GITHUB_TOKEN
      # push will be rejected — run releases from an unprotected branch or swap
      # in a PAT/deploy key with bypass rights.
      #
      # When the bump was skipped there is nothing to commit; the tag is only
      # created if it does not exist yet, and an existing tag is never moved.
      - name: Commit and tag
        env:
          TAG: ${{ steps.bump.outputs.version }}
          CHANGED: ${{ steps.bump.outputs.changed }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ "${CHANGED}" = "true" ]; then
            git commit -am "chore(release): ${TAG}"
            git tag -a "${TAG}" -m "${TAG}"
            git push origin HEAD
            git push origin "${TAG}"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "::notice::Tag ${TAG} already exists and was left where it is; publishing from ${GITHUB_SHA}"
          else
            git tag -a "${TAG}" -m "${TAG}"
            git push origin "${TAG}"
          fi

      # `prepublishOnly` (build + strict lint) runs automatically here.
      - name: Publish to npm
        # npm (not pnpm) so `--provenance` is honoured regardless of pnpm version.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
